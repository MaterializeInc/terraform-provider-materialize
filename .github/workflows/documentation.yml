name: documentation
on:
  pull_request:
    paths:
      - pkg/**
      - examples/**
      - templates/**
      - README.md

jobs:
  documentation:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - run: go generate ./...

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: Terraform Docs
