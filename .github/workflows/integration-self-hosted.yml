name: integration
on:
  pull_request:
    paths:
      - pkg/**
      - integration/self_hosted/**
      - integration/sqlserver/**
      - compose.yaml
      - .github/workflows/integration-self-hosted.yml
      - main.go
      - go.mod
  schedule:
    - cron: 1 11 * * 0

jobs:
  self-hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker Compose Up
        run: docker compose up --build -d materialized materialized_init redpanda postgres mysql provider sqlserver

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail=200
          # The healthcheck output says why the container never went healthy.
          docker inspect --format '{{json .State.Health}}' sqlserver || true

      - name: Terraform Init
        run: |
          docker exec --workdir /usr/src/app/integration/self_hosted provider terraform init

      - name: Terraform Apply
        run: |
          docker exec --workdir /usr/src/app/integration/self_hosted provider terraform apply -auto-approve -compact-warnings

      - name: Terraform Plan
        run: |
          docker exec --workdir /usr/src/app/integration/self_hosted provider terraform plan -detailed-exitcode

      - name: Terraform Destroy
        run: |
          docker exec --workdir /usr/src/app/integration/self_hosted provider terraform destroy -auto-approve -compact-warnings

      - name: Docker Compose Down
        run: docker compose down
